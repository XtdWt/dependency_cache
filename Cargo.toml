[package]
name = "dependency_cache"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "dependency_cache"
crate-type = ["cdylib"]

[dependencies.pyo3]
version = "0.28.3"
features = ["abi3-py38"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
